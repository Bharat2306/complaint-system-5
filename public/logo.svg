<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#logoGrad)" filter="url(#shadow)"/>
  
  <!-- Inner Shield Shape -->
  <path d="M50 22 C36 22 28 27 28 27 V50 C28 66 40 77 50 82 C60 77 72 66 72 50 V27 C72 27 64 22 50 22 Z" 
        fill="url(#shieldGrad)" 
        opacity="0.95" />
        
  <!-- Inner Check & Lightning Accent -->
  <path d="M42 51 L48 57 L60 41" 
        fill="none" 
        stroke="#4f46e5" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Small Star Sparkle -->
  <circle cx="68" cy="24" r="4" fill="#10b981" />
</svg>
